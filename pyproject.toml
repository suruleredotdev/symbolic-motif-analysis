[project]
name = "panel-art"
version = "0.1.0"
description = "Symbolic motif analysis pipeline for Frobenius panel art"
requires-python = "==3.12.*"
dependencies = [
    # Image I/O and basic processing
    "Pillow",
    "numpy>=1.24,<2",           # torch 2.2.x requires numpy 1.x ABI
    "scikit-image",
    # Computer vision — headless avoids Qt/display deps on servers
    "opencv-python-headless",
    # SAM (Segment Anything Model) — original ViT-B/L/H checkpoints
    "segment-anything",
    # Notebook UI
    "ipywidgets",
    # Neural models
    # PyTorch 2.2.x is the last release with Intel Mac (x86_64) wheels.
    # macOS arm64 users can remove the version pins.
    "torch>=2.2,<2.3",
    "torchvision>=0.17,<0.18",
    "open-clip-torch",          # CLIP ViT-L/14 image + text embeddings
    # SAM-2 for zero-shot motif segmentation
    # Install via: pip install git+https://github.com/facebookresearch/sam2.git
    # or: pip install segment-anything-2
    # Listed here as optional — pipeline degrades gracefully without it
    # Vectorisation — calls system `potrace` binary (brew install potrace)
    "svgwrite",                 # pure-Python SVG generation from contours
    "svgpathtools",             # SVG path parsing and normalisation
    # Clustering + similarity
    "scikit-learn",
    "hdbscan",
    # Claude API for motif descriptions
    "anthropic",
    # Visualisation
    "matplotlib",
    "ipympl",              # interactive matplotlib figures in Jupyter (drag-draw)
]

[project.optional-dependencies]
# SAM-2 must be installed separately from GitHub (not on PyPI):
#   uv pip install git+https://github.com/facebookresearch/sam2.git
# Then download a checkpoint — tiny model (~40 MB):
#   wget https://dl.fbaipublicfiles.com/segment_anything_2/092824/sam2.1_hiera_tiny.pt
#   wget https://raw.githubusercontent.com/facebookresearch/sam2/main/sam2/configs/sam2.1/sam2.1_hiera_t.yaml
sam2 = []

[project.scripts]
panel-art = "panel_art.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# panel_art/ is the importable package
packages = ["panel_art"]

[tool.uv]
# Keep existing standalone scripts in place; package lives in panel_art/
package = true
